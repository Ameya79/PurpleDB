[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[project]
name = "purpledb"
version = "1.0.0"
description = "Embedded multimodal database for semantic video and image search"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "PurpleDB Contributors" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Database",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/Ameya79/PurpleDB"
Repository = "https://github.com/Ameya79/PurpleDB.git"
Issues = "https://github.com/Ameya79/PurpleDB/issues"
